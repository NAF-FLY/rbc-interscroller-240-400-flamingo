<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=240, height=400, initial-scale=1.0" />
  <meta name="ad.size" content="width=240,height=400" />
  <script type="text/javascript" src="https://ds.serving-sys.ru/BurstingScript/EBLoader.js"></script>
  <title>HTML5 Banner</title>
  <style>
    html, body {
      margin: 0;
      width: 240px;
      height: 400px;
      overflow: hidden;
      background: #000;
    }

    .banner {
      display: block;
      position: relative;
      width: 240px;
      height: 400px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    .layer {
      position: absolute;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .bg {
      left: 0;
      top: 0;
      width: 240px;
      height: 400px;
    }

    .bottom-fade {
      left: 0;
      bottom: 0;
      width: 240px;
      height: 190px;
      z-index: 7;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, .28) 22%, rgba(0, 0, 0, .72) 58%, rgba(0, 0, 0, .96) 100%);
    }

    .corner-logo {
      top: 8px;
      right: 8px;
      bottom: auto;
      width: 62px;
      height: 46px;
      z-index: 3;
      opacity: 1;
      will-change: opacity;
      animation: cornerLogoFade .35s ease-out 1.05s forwards;
    }

    .flamingo {
      display: block;
      transform-style: preserve-3d;
      contain: paint;
      z-index: 6;
      left: 0;
      top: 0;
      width: 240px;
      height: 400px;
      transform: translate3d(12px, -23px, 0) scale3d(2.0964, 2.0964, 1);
      transform-origin: center center;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      animation: flamingoAnim 5s forwards;
    }

    .offer-card,
    .cta-button,
    .disclaimer {
      position: absolute;
      z-index: 5;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .offer-card {
      left: 50%;
      top: 5px;
      bottom: auto;
      width: 230px;
      height: 139px;
      margin-left: -115px;
      padding: 10px;
      border-radius: 16px;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
    }

    .offer-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .22);
      clip-path: inset(100% 0 0 0 round 16px);
      animation: cardReveal .9s cubic-bezier(.33, 1, .68, 1) 2s forwards;
    }

    .offer-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .offer-title {
      margin: 0;
      width: 207px;
      height: 50px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title-row {
      position: relative;
      left: 0;
      overflow: hidden;
    }

    .title-row.row-1 {
      width: 207px;
      height: 20px;
    }

    .title-row.row-2 {
      width: 199px;
      height: 28px;
    }

    .title-face {
      position: absolute;
      inset: 0;
      display: block;
    }

    .title-face svg {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .title-row.row-1 .title-face svg {
      height: 18px;
    }

    .title-row.row-1 .title-face.next svg {
      width: 198px;
      height: 21px;
    }

    .title-row.row-2 .title-face.current svg {
      height: 21px;
      top: 5px;
    }

    .title-row.row-2 .title-face.next svg {
      width: 198px;
      height: 27px;
    }

    .title-face.current {
      opacity: 0;
      transform: translate3d(0, -8%, 0) scale3d(1, 0, 1);
      transform-origin: 50% 0%;
      animation:
        titleCurrentEnter 1.28s cubic-bezier(.22, .61, .36, 1) forwards,
        titleCurrentFlip .98s cubic-bezier(.22, .61, .36, 1) forwards;
    }

    .title-face.next {
      opacity: 0;
      transform: translate3d(0, -8%, 0) scale3d(1, 0, 1);
      transform-origin: 50% 0%;
      animation: titleNextFlip .82s cubic-bezier(.22, .61, .36, 1) forwards;
    }

    .title-row.row-1 .title-face.current {
      animation-delay: 2.55s, 6s;
    }

    .title-row.row-2 .title-face.current {
      animation-delay: 2.67s, 6s;
    }

    .title-row.row-1 .title-face.next {
      animation-delay: 6s;
    }

    .title-row.row-2 .title-face.next {
      animation-delay: 6s;
    }

    .offer-bottom {
      position: absolute;
      right: 0px;
      bottom: 0px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .t2-logo {
      display: block;
      width: 63.23px;
      height: 46.56px;
      min-width: 63.23px;
      max-width: 63.23px;
      min-height: 46.56px;
      max-height: 46.56px;
      flex: 0 0 63.23px;
      align-self: flex-end;
      opacity: 0;
      transform: translate3d(0, 22px, 0) scale(.92);
      transform-origin: 50% 100%;
      animation: logoReveal .82s cubic-bezier(.2, .8, .2, 1) 2.84s forwards;
    }

    .t2-logo:not([src]),
    .final-screen-logo:not([src]),
    .t2-logo:not([data-video-started='true']),
    .final-screen-logo:not([data-video-started='true']) {
      visibility: hidden;
    }

    .cta-button {
      left: 50%;
      bottom: 22.5px;
      width: 230px;
      height: 40px;
      z-index: 7;
      margin-left: -115px;
      border: 0;
      border-radius: 100px;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
    }

    .cta-button::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 100px;
      background: #ff3495;
      clip-path: inset(100% 0 0 0 round 100px);
      animation: buttonReveal .8s cubic-bezier(.22, .7, .2, 1) 6s forwards;
    }

    .cta-button-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: inset(100% 0 0 0 round 100px);
      animation: buttonReveal .8s cubic-bezier(.22, .7, .2, 1) 6s forwards;
    }

    .cta-button svg {
      display: block;
      width: 136px;
      height: 16px;
      padding-top: 2px;
    }

    .disclaimer {
      left: 50%;
      bottom: 9px;
      z-index: 8;
      width: 100%;
      font-weight: 400;
      font-size: 6.4px;
      line-height: 1.1;
      color: #fff;
      text-align: center;
      transform: translateX(-50%);
    }

    .final-fade {
      inset: 0;
      z-index: 10;
      background: #000;
      opacity: 0;
      animation: finalFade .5s ease-out 9s forwards;
    }

    .final-screen {
      inset: 0;
      z-index: 11;
      opacity: 0;
      animation: finalScreenReveal .01s linear 9.6s forwards;
    }

    .final-screen-logo {
      left: 50%;
      top: 150px;
      width: 108.65px;
      height: 80px;
      min-width: 108.65px;
      max-width: 108.65px;
      min-height: 80px;
      max-height: 80px;
      transform: translate3d(-50%, 18px, 0);
      opacity: 0;
      animation: finalScreenLogo 1.7s cubic-bezier(.22, .72, .2, 1) 9.6s forwards;
    }

    .final-screen-copy {
      left: 50%;
      bottom: 28px;
      width: 206px;
      transform: translateX(-50%);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 8px;
      line-height: 1.12;
      font-weight: 400;
      text-align: center;
      color: #fff;
      opacity: 0;
      animation: finalScreenText .75s ease-out 10.3s forwards;
    }

    @keyframes flamingoAnim {
      0% {
        transform: translate3d(12px, -23px, 0) scale3d(2.0964, 2.0964, 1);
        animation-timing-function: cubic-bezier(.325, -0.008, .265, .972);
      }
      100% {
        transform: translate3d(0, -15px, 0) scale3d(1.1, 1.1, 1);
      }
    }

    @keyframes cardReveal {
      from {
        clip-path: inset(0 0 100% 0 round 16px);
      }
      to {
        clip-path: inset(0 0 0 0 round 16px);
      }
    }

    @keyframes cardLift {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(0, -44px, 0);
      }
    }

    @keyframes buttonReveal {
      from {
        clip-path: inset(100% 0 0 0 round 100px);
      }
      to {
        clip-path: inset(0 0 0 0 round 100px);
      }
    }

    @keyframes logoReveal {
      from {
        transform: translate3d(0, 22px, 0) scale(.92);
        opacity: 0;
      }
      to {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes titleCurrentEnter {
      0% {
        transform: translate3d(0, -8%, 0) scale3d(1, 0, 1);
        opacity: 0;
      }
      100% {
        transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
        opacity: 1;
      }
    }

    @keyframes titleCurrentFlip {
      0% {
        transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 8%, 0) scale3d(1, 0, 1);
        opacity: 0;
      }
    }

    @keyframes titleNextFlip {
      0% {
        transform: translate3d(0, -8%, 0) scale3d(1, 0, 1);
        opacity: 0;
      }
      100% {
        transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
        opacity: 1;
      }
    }

    @keyframes cornerLogoFade {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    @keyframes finalFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes finalScreenReveal {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes finalScreenLogo {
      from {
        transform: translate3d(-50%, 18px, 0);
        opacity: 0;
      }
      to {
        transform: translate3d(-50%, 0, 0);
        opacity: 1;
      }
    }

    @keyframes finalScreenText {
      from {
        transform: translate3d(-50%, 10px, 0);
        opacity: 0;
      }
      to {
        transform: translate3d(-50%, 0, 0);
        opacity: .7;
      }
    }
  </style>
</head>

        }
        titleStartDelay = getFirstAnimationDelayMs(titleTrigger);
        videoPlayers.forEach(function (player) {
          var trigger = player.getAttribute('data-video-trigger');
          var delay = Number(player.getAttribute('data-video-delay')) || 0;
          primeVideo(player);
          if (trigger === 'title-start') {
            return;
          }
          window.setTimeout(function () {
            startVideo(player);
          }, Math.max(delay - VIDEO_START_ADVANCE_MS, 0));
        });
        if (titleTrigger) {
          if (titleStartDelay !== null) {
            window.setTimeout(function () {
              videoPlayers.forEach(function (player) {
                if (player.getAttribute('data-video-trigger') === 'title-start') {
                  startVideo(player);
                }
              });
            }, Math.max(titleStartDelay - VIDEO_START_ADVANCE_MS, 0));
          } else {
            titleTrigger.addEventListener('animationstart', function (event) {
              if (event.animationName === 'titleCurrentEnter') {
                videoPlayers.forEach(function (player) {
                  if (player.getAttribute('data-video-trigger') === 'title-start') {
                    startVideo(player);
                  }
                });
              }
            }, { once: true });
          }
        }
      }
      function initEB() {
        initVideoPlayers();

        if (hasEB()) {
          if (!window.EB.isInitialized()) {
            window.EB.addEventListener(window.EBG.EventName.EB_INITIALIZED, startAd);
          } else {
            startAd();
          }
          return;
        }

        startAd();
      }

      window.addEventListener('load', initEB);
    })();
  </script>
</body>
</html>
